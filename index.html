<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Snap - Análise de Turno</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .zone { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; border-radius: 4px; background-color: #fafafa; }
        .zone h3 { margin-top: 0; }
        .zone select, .zone input[type="number"], .zone button { margin-right: 5px; padding: 8px; border-radius: 4px; border: 1px solid #ddd; }
        .zone button { background-color: #5cb85c; color: white; cursor: pointer; }
        .zone button:hover { background-color: #4cae4c; }
        .zone .card-list { min-height: 20px; background-color: #eee; padding: 5px; border-radius: 3px; }
        .zone .card-item { background-color: #fff; border: 1px solid #ddd; padding: 3px 6px; margin: 3px; display: inline-block; border-radius: 3px; font-size: 0.9em; }
        #resultsArea { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background-color: #e9efff; border-radius: 4px; }
        #resultsArea h3 { margin-top: 0; }
        #analyzeButton { padding: 10px 15px; font-size: 1.1em; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #analyzeButton:hover { background-color: #0056b3; }
        .game-parameters input[type="number"] { width: 60px; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Marvel Snap - Análise Tática de Turno</h1>

        <h2>Configurar Estado do Jogo:</h2>

        <div class="game-parameters">
            <label for="currentTurn">Turno Atual:</label>
            <input type="number" id="currentTurn" value="1" min="1" max="7">
            <label for="currentEnergy">Energia Atual:</label>
            <input type="number" id="currentEnergy" value="1" min="0">
            <label for="maxEnergy">Energia Máxima:</label>
            <input type="number" id="maxEnergy" value="1" min="0">
        </div>
        <hr>

        <div>
            <label for="cardSelector">Selecionar Carta (ID):</label>
            <input type="text" id="cardIdInput" placeholder="Ex: 1 (Blade)">
        </div>
        <br>

        <div id="zonesContainer">
            <div class="zone" id="handZone">
                <h3>Mão (<span id="handCount">0</span>)</h3>
                <button onclick="addCardToZone('hand')">Adicionar à Mão</button>
                <div class="card-list" id="handCardList"></div>
            </div>

            <div class="zone" id="location1Zone">
                <h3>Local 1 (<span id="location1Count">0</span>)</h3>
                <button onclick="addCardToZone('location1')">Adicionar ao Local 1</button>
                <div class="card-list" id="location1CardList"></div>
            </div>

            <div class="zone" id="location2Zone">
                <h3>Local 2 (<span id="location2Count">0</span>)</h3>
                <button onclick="addCardToZone('location2')">Adicionar ao Local 2</button>
                <div class="card-list" id="location2CardList"></div>
            </div>

            <div class="zone" id="location3Zone">
                <h3>Local 3 (<span id="location3Count">0</span>)</h3>
                <button onclick="addCardToZone('location3')">Adicionar ao Local 3</button>
                <div class="card-list" id="location3CardList"></div>
            </div>

            <div class="zone" id="discardZone">
                <h3>Descarte (<span id="discardCount">0</span>)</h3>
                <button onclick="addCardToZone('discard')">Adicionar ao Descarte</button>
                <div class="card-list" id="discardCardList"></div>
            </div>
        </div>
        <hr>

        <button id="analyzeButton">Analisar Turno (Estado Atual)</button>

        <div id="resultsArea">
            <h3>Resultados da Análise:</h3>
            <div id="analysisResultsOutput">
                <p>Configure o estado do jogo e clique em "Analisar Turno".</p>
            </div>
        </div>
    </div>

    <script>
// script.js (embedded in index.html for this subtask)

// --- Local Game State ---
const localGameState = {
    hand_ids: [],
    discard_ids: [],
    location1_ids: [],
    location2_ids: [],
    location3_ids: [],
    // Deck IDs are not explicitly managed on this simplified frontend.
    // The backend will know the full deck from start_game and then we'll tell it
    // which cards are in hand/discard/locations for rehydration.
    // Play history is also managed by backend primarily.
};

// --- Card Data (for display purposes) ---
const cardManifest = {
    1: { name: 'Blade' }, 2: { name: 'Gambit' }, 3: { name: 'Corvus Glaive' },
    4: { name: 'Jubilee' }, 5: { name: 'Ghost Rider' }, 6: { name: 'Blink' },
    7: { name: 'Legion' }, 8: { name: 'Infinity Ultron' }, 9: { name: 'Gorr' },
    10: { name: 'Hela' }, 11: { name: 'Odin' }, 12: { name: 'The Infinaut' },
    101: { name: 'Mind Stone' }, 102: { name: 'Power Stone' }, 103: { name: 'Reality Stone' },
    104: { name: 'Soul Stone' }, 105: { name: 'Space Stone' }, 106: { name: 'Time Stone' }
};

// --- UI Update Functions ---
function getZoneName(zoneId) {
    if (zoneId === 'hand') return 'Mão';
    if (zoneId === 'location1') return 'Local 1';
    if (zoneId === 'location2') return 'Local 2';
    if (zoneId === 'location3') return 'Local 3';
    if (zoneId === 'discard') return 'Descarte';
    return 'Zone';
}

function renderZone(zoneId) {
    const cardListDiv = document.getElementById(`${zoneId}CardList`);
    const countSpan = document.getElementById(`${zoneId}Count`);
    if (!cardListDiv || !countSpan) return;

    cardListDiv.innerHTML = '';
    const ids_key = `${zoneId}_ids`;

    localGameState[ids_key].forEach((cardId, index) => {
        const cardName = cardManifest[cardId] ? cardManifest[cardId].name : `ID Desconhecido: ${cardId}`;
        const cardItem = document.createElement('span');
        cardItem.className = 'card-item';
        cardItem.textContent = cardName;

        const removeButton = document.createElement('button');
        removeButton.textContent = 'x';
        removeButton.style.marginLeft = '5px';
        removeButton.style.cursor = 'pointer';
        removeButton.onclick = () => removeCardFromZone(zoneId, index);
        cardItem.appendChild(removeButton);

        cardListDiv.appendChild(cardItem);
    });
    countSpan.textContent = localGameState[ids_key].length;
}

function addCardToZone(zoneId) {
    const cardIdInput = document.getElementById('cardIdInput');
    const cardId = parseInt(cardIdInput.value);

    if (isNaN(cardId) || !cardManifest[cardId]) {
        alert('Por favor, insira um ID de carta válido.');
        return;
    }

    const ids_key = `${zoneId}_ids`;
    const zoneName = getZoneName(zoneId);

    if (zoneId.startsWith('location') && localGameState[ids_key].length >= 4) {
        alert(`O ${zoneName} já tem 4 cartas.`);
        return;
    }

    localGameState[ids_key].push(cardId);
    renderZone(zoneId);
    cardIdInput.value = '';
}

function removeCardFromZone(zoneId, cardIndexInZone) {
    const ids_key = `${zoneId}_ids`;
    if (cardIndexInZone >= 0 && cardIndexInZone < localGameState[ids_key].length) {
        localGameState[ids_key].splice(cardIndexInZone, 1);
        renderZone(zoneId);
    }
}

// --- Event Listener for Analyze Button ---
// This button will now use the /api/get_next_turn_analysis endpoint.
// Other buttons for /api/start_game etc. would be added if needed by UI flow.
document.getElementById('analyzeButton').addEventListener('click', async () => {
    const resultsOutputDiv = document.getElementById('analysisResultsOutput');
    resultsOutputDiv.innerHTML = '<p>Analisando... Por favor, aguarde.</p>';

    const currentTurn = parseInt(document.getElementById('currentTurn').value);
    const currentEnergy = parseInt(document.getElementById('currentEnergy').value);
    const maxEnergy = parseInt(document.getElementById('maxEnergy').value);

    if (isNaN(currentTurn) || isNaN(currentEnergy) || isNaN(maxEnergy)) {
        resultsOutputDiv.innerHTML = '<p style="color: red;">Erro: Turno ou Energia inválidos.</p>';
        return;
    }

    // Construct the current_game_state payload based on UI inputs
    const current_game_state_payload = {
        turn: currentTurn,
        current_energy: currentEnergy,
        max_energy: maxEnergy,
        hand_ids: localGameState.hand_ids,
        discard_ids: localGameState.discard_ids,
        // Deck IDs are not sent from this basic UI; backend GameState will have its own default
        // and then filter it based on known cards in hand/discard/locations when rehydrating.
        // For /api/get_next_turn_analysis, the backend needs a complete deck_ids list to be accurate.
        // This is a known simplification in this UI. For accurate analysis, deck state is crucial.
        // We will let the backend initialize its default deck and then filter.
        deck_ids: [], // Sending empty, backend will use its default then filter.
                      // Or, for more accuracy, UI would need to manage/send deck state.
        locations: [
            localGameState.location1_ids,
            localGameState.location2_ids,
            localGameState.location3_ids
        ],
        play_history_ids: [] // Play history is primarily managed by backend logic based on actions.
                             // For a simple "analyze current state", it might be empty or provided if relevant.
    };

    const payload = {
        current_game_state: current_game_state_payload
        // 'player_actions' and 'resolved_random_outcomes' are not needed for get_next_turn_analysis
    };

    try {
        // MODIFIED FETCH URL
        const response = await fetch('http://127.0.0.1:5001/api/get_next_turn_analysis', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
        });

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({ detail: "Erro desconhecido ao processar resposta do servidor." }));
            throw new Error(`Erro do servidor: ${response.status} ${response.statusText}. Detalhes: ${errorData.detail || 'N/A'}`);
        }

        const resultsData = await response.json();
        // The endpoint /api/get_next_turn_analysis returns { "top_10_outcomes": [...] }
        displayResults(resultsData.top_10_outcomes);

    } catch (error) {
        console.error('Erro ao analisar turno:', error);
        resultsOutputDiv.innerHTML = `<p style="color: red;">Falha ao buscar análise: ${error.message}</p>`;
    }
});

function displayResults(results) {
    const resultsOutputDiv = document.getElementById('analysisResultsOutput');
    resultsOutputDiv.innerHTML = '';

    if (!results || results.length === 0) {
        resultsOutputDiv.innerHTML = '<p>Nenhum resultado de análise retornado ou nenhuma jogada possível.</p>';
        return;
    }

    const ul = document.createElement('ul');
    results.forEach((result, index) => {
        const li = document.createElement('li');
        const probPercent = (result.prob * 100).toFixed(2);
        const outcomeStr = `L0: ${result.outcome[0]}, L1: ${result.outcome[1]}, L2: ${result.outcome[2]}`;
        li.textContent = `${index + 1}. Prob: ${probPercent}% | Resultado: (${outcomeStr}) | Ação Sugerida: ${result.action}`;
        ul.appendChild(li);
    });
    resultsOutputDiv.appendChild(ul);
}

document.addEventListener('DOMContentLoaded', () => {
    renderZone('hand');
    renderZone('location1');
    renderZone('location2');
    renderZone('location3');
    renderZone('discard');
});

    </script>
</body>
</html>
